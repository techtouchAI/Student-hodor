plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("../tools/keystore/keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "iq.techtouch.student_hodor"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // core library desugaring: إلزامي مع flutter_local_notifications حتى
        // دون جدولة إشعارات (متطلب معلن في وثائق الوسيطة).
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "iq.techtouch.student_hodor"
        // 24 إلزامي: flutter_local_notifications v21+ يتطلب أندرويد 7.0+.
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            def ksFile = rootProject.file("../tools/keystore/student_hodor.jks")
            if (ksFile.exists()) {
                storeFile = ksFile
                storePassword = keystoreProperties.getProperty("storePassword", "studenthodor")
                keyAlias = keystoreProperties.getProperty("keyAlias", "student_hodor")
                keyPassword = keystoreProperties.getProperty("keyPassword", "studenthodor")
            }
        }
    }

    buildTypes {
        release {
            signingConfig = rootProject.file("../tools/keystore/student_hodor.jks").exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // مكتبة desugaring المرفقة بأندرويد (تُستخدم من compileOptions أعلاه).
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

flutter {
    source = "../.."
}

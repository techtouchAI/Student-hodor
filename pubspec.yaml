name: student_hodor
description: >-
  نظام حضور الطلاب بالباركود/QR — تطبيق أندرويد أوفلاين بالكامل، قاعدة بيانات
  محلية، بادجات طلابية قابلة للطباعة، وتقارير Excel/PDF عربية.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # حالة وتنقل
  flutter_riverpod: ^2.5.0
  go_router: ^14.2.0

  # قاعدة البيانات المحلية (SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # المسح بالكاميرا (MLKit مضمّن، أوفلاين)
  mobile_scanner: ^5.2.0

  # التصدير
  excel: ^4.0.0
  pdf: ^3.10.0
  printing: ^5.12.0
  archive: ^3.4.9

  # توليد الرموز
  qr: ^3.0.1
  barcode: ^2.1.0

  # ملفات وصور ومشاركة
  image_picker: ^1.1.0
  file_picker: ^8.0.0
  share_plus: ^9.0.0

  # تجربة شاشة المسح
  wakelock_plus: ^1.2.0
  vibration: ^1.8.0

  # تواريخ
  intl: ^0.19.0
  hijri_converter: ^1.0.0

  # معلومات الإصدار
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

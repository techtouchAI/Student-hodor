name: verify

# بوابة تحقق سريعة (analyze + tests) دون بناء APK — للتكرار السريع على الإصلاحات.
# عند الفشل ينشر تفاصيل الأخطاء تعليقاً على طلب السحب (يُحدَّث في كل إعادة).
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # سجلات `ci-diagnostics/` المرفوعة مع المستودع قد تكون من تشغيل قديم؛
      # تُمسح أولاً حتى لا يُنشر سجل قديم مكان سجل هذا التشغيل.
      - name: Clear stale logs
        run: rm -f ci_*.log

      - name: Pub get
        run: flutter pub get

      - name: Codegen (drift)
        # السجل يُحفظ ليُرفق بتعليق الفشل: فشل التوليد يعني عادة خطأ ترجمة في
        # أحد ملفات `lib/`، ونص الخطأ وحده يكفي لتشخيصه بلا تنزيل سجلات.
        run: set -o pipefail; dart run build_runner build --delete-conflicting-outputs 2>&1 | tee ci_codegen.log

      - name: Analyze (zero warnings policy)
        run: set -o pipefail; flutter analyze --fatal-warnings --fatal-infos 2>&1 | tee ci_analyze.log

      - name: Unit & widget tests
        run: set -o pipefail; flutter test --reporter expanded --timeout 60s 2>&1 | tee ci_test.log

      - name: Report failure details to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## تفاصيل فشل التحقق (تقرير تلقائي)'
            echo
            echo "الالتزام: \`$(git rev-parse --short HEAD)\` — $(date -u +%FT%TZ)"
            if [ -s ci_codegen.log ]; then
              echo
              echo '### build_runner (codegen)'
              echo '```'
              tail -n 120 ci_codegen.log
              echo '```'
            fi
            if [ -s ci_analyze.log ]; then
              echo
              echo '### flutter analyze'
              echo '```'
              tail -n 200 ci_analyze.log
              echo '```'
            fi
            if [ -s ci_test.log ]; then
              echo
              # كتلة كل اختبار فاشل كاملة: الرسالة وExpected/Actual والسبب
              # والمسار — لأن ذيل السجل وحده يقصّ الكتل الأولى.
              echo '### flutter test (كتل الفشل)'
              echo '```'
              grep -n -B2 -A14 '\[E\]' ci_test.log | head -n 500
              echo '```'
              echo
              echo '### flutter test (الملخّص)'
              echo '```'
              grep -E '^(Failing tests:|  /home/|.*Some tests failed)' ci_test.log \
                | head -n 60
              tail -n 3 ci_test.log
              echo '```'
            fi
          } > report.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file report.md

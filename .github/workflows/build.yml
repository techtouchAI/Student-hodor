name: build-apk

on:
  push:
    branches: [arena/01a0a683-student-hodor, main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & publish release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # أهم خطوة لتسريع البناء: تخزين تبعيات Gradle وتوزيعته بين التشغيلات
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Codegen (drift)
        run: dart run build_runner build

      # فحص المشروع: يفشل فقط عند الأخطاء والتحذيرات الحقيقية
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Wrapper غير مودَع في المستودع، نولّده مرة واحدة فقط إن لم يكن موجوداً
      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f android/gradlew ]; then
            tmp="$(mktemp -d)"
            touch "$tmp/settings.gradle" "$tmp/build.gradle"
            (cd "$tmp" && gradle wrapper --gradle-version 8.14.3 --distribution-type bin -q)
            cp "$tmp/gradlew" "$tmp/gradlew.bat" android/
            cp -r "$tmp/gradle" android/
            rm -rf "$tmp"
            chmod +x android/gradlew
          fi

      - name: Build release APK
        run: flutter build apk --release

      # التحقق من نجاح البناء: الملف موجود، موقّع بمفتاح الـ Release، مع بصمة SHA256
      - name: Verify APK
        run: |
          set -e
          cd build/app/outputs/flutter-apk
          ls -la
          test -s app-release.apk
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$bt/apksigner" verify --print-certs app-release.apk | tee apksigner.log
          grep -q "CN=Student Hodor" apksigner.log || { echo "APK is NOT signed with the release key!"; exit 1; }
          sha256sum app-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # النشر أولًا (التسليم الأساسي) — تحديث بدون حذف/إعادة إنشاء التاغ
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd build/app/outputs/flutter-apk
          tag=latest-apk
          title="Student Hodor — أحدث APK"
          notes="بُني تلقائياً من ${{ github.sha }} في $(date -u +%F' '%H:%M'UTC')"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" app-release.apk SHA256SUMS.txt --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" app-release.apk SHA256SUMS.txt \
              --title "$title" --notes "$notes" --target "${{ github.sha }}"
          fi
          echo "Download: https://github.com/${{ github.repository }}/releases/tags/$tag"

      # نسخة احتياطية مرفقة بالتشغيل — لا تعرقل النشر إذا امتلأت حصة التخزين
      - name: Upload APK artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          retention-days: 3
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt

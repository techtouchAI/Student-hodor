name: verify

# بوابة تحقق سريعة (analyze + tests) دون بناء APK — للتكرار السريع على الإصلاحات.
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Codegen (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (zero warnings policy)
        run: flutter analyze --fatal-warnings --fatal-infos

      - name: Unit & widget tests
        run: flutter test --reporter expanded

name: build-apk

on:
  push:
    branches: [arena/01a0a683-student-hodor, main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & publish release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          # تخزين تلقائي لـ ~/.gradle/caches و ~/.gradle/wrapper بين التشغيلات
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Codegen (drift)
        run: dart run build_runner build

      # فحص المشروع: يفشل فقط عند الأخطاء والتحذيرات الحقيقية
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      # التحقق من نجاح البناء: الملف موجود وموقّع بمفتاح الـ Release
      - name: Verify APK
        run: |
          set -e
          cd build/app/outputs/flutter-apk
          ls -la
          test -s app-release.apk
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$bt/apksigner" verify --print-certs app-release.apk | tee apksigner.log
          grep -q "CN=Student Hodor" apksigner.log || { echo "APK is NOT signed with the release key!"; exit 1; }
          sha256sum app-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # نشر غير مدمِّر: إنشاء مرة واحدة ثم تحديث في المكان (بدون حذف التاغ)
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd build/app/outputs/flutter-apk
          tag=latest-apk
          title="Student Hodor — أحدث APK"
          notes="بُني تلقائياً من ${{ github.sha }} في $(date -u +%F' '%H:%M'UTC')"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" app-release.apk SHA256SUMS.txt --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" app-release.apk SHA256SUMS.txt \
              --title "$title" --notes "$notes" --target "${{ github.sha }}"
          fi

      # ضمان نهائي: تنزيل الـ APK المنشور فعلياً من داخل GitHub ومطابقة بصمته
      - name: Verify published APK downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          gh release download latest-apk -p 'app-release.apk' -p 'SHA256SUMS.txt' --dir /tmp/verify
          cd /tmp/verify
          sha256sum -c SHA256SUMS.txt
          echo "Published APK download verified OK"

      # نسخة احتياطية في صفحة التشغيل — لا تعرقل النشر إن امتلأت حصة تخزين الحساب
      - name: Upload APK artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          retention-days: 3
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt

      # ملخص يظهر في صفحة التشغيل: رابط التنزيل + البصمة
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Student Hodor — APK جاهز"
            echo ""
            echo "- **التنزيل المباشر:** [app-release.apk](https://github.com/${{ github.repository }}/releases/download/latest-apk/app-release.apk)"
            echo "- **صفحة الإصدار:** [latest-apk](https://github.com/${{ github.repository }}/releases/tags/latest-apk)"
            echo "- **الكوميت:** \`${{ github.sha }}\`"
            echo ""
            echo '```'
            cat build/app/outputs/flutter-apk/SHA256SUMS.txt 2>/dev/null || echo "(no checksum)"
            echo '```'
            echo ""
            echo "> المستودع خاص: يتطلب التنزيل تسجيل الدخول إلى GitHub."
          } >> "$GITHUB_STEP_SUMMARY"
